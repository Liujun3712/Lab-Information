name: 加密并部署到 GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 强制所有 action 使用 Node 24 运行时（消除弃用警告）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 staticrypt 最新版
        run: npm install -g staticrypt@latest

      - name: 加密敏感页面并准备部署目录
        env:
          STATICRYPT_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
        run: |
          mkdir -p _site
          cp src/index.html _site/index.html
          
          # 通过环境变量传密码，避免交互提示
          staticrypt src/lab-network-config.html -o _site/lab-network-config.html -f
          
          if [ ! -f "_site/lab-network-config.html" ]; then
            echo "❌ 加密文件未生成！"
            exit 1
          fi
          echo "✅ 加密完成，_site 内容："
          ls -la _site/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4