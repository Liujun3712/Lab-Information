name: 加密并部署到 GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 staticrypt
        run: npm install -g staticrypt@3.5.0

      - name: 加密敏感页面并准备部署目录
        env:
          PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
        run: |
          mkdir -p _site
          cp src/index.html _site/index.html
          export STATICRYPT_PASSWORD="$PASSWORD"
          staticrypt src/lab-network-config.html -o _site/lab-network-config.html -f
          
          if [ ! -f "_site/lab-network-config.html" ]; then
            echo "❌ 加密文件未生成！"
            exit 1
          fi
          echo "✅ 加密完成，_site 目录内容："
          ls -la _site/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4